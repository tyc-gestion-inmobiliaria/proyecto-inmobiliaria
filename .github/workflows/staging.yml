# Lleva las migraciones de main a la base de staging (Arquitectura §7.1,
# PB-03). Corre solo cuando el CI de main terminó en verde: lo que no pasó
# las pruebas no llega a staging.
#
# Necesita, en el environment `staging` de GitHub:
#   - secreto SUPABASE_ACCESS_TOKEN  (token personal de la CLI de Supabase)
#   - secreto SUPABASE_DB_PASSWORD   (la contraseña de la base del proyecto)
#   - variable SUPABASE_PROJECT_REF  (el id del proyecto: <ref>.supabase.co)
# Mientras no estén, el job avisa y termina sin hacer nada. El paso a paso
# está en docs/entornos.md.
#
# La web a staging no está acá: depende del hosting (ADR-007, por decidir).
name: Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  base:
    name: Migraciones a staging
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: ¿Está configurado staging?
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Staging todavía no está configurado (faltan secretos o la variable SUPABASE_PROJECT_REF). Ver docs/entornos.md."
            echo "listo=false" >> "$GITHUB_OUTPUT"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.listo == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El commit que pasó el CI, no el último de main.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - if: steps.config.outputs.listo == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - name: Enlazar el proyecto
        if: steps.config.outputs.listo == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Migraciones pendientes
        if: steps.config.outputs.listo == 'true'
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
      # Sin --include-seed: la semilla es para la base local, no para staging.
      - name: Aplicar migraciones
        if: steps.config.outputs.listo == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
